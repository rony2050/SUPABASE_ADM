version: "3.8"

name: supabase_${INSTANCE_NAME}

networks:
  default:
    name: supabase_net_${INSTANCE_NAME}

volumes:
  db_data:
    name: supabase_db_data_${INSTANCE_NAME}
  storage_data:
    name: supabase_storage_data_${INSTANCE_NAME}

services:
  studio:
    container_name: supabase_${INSTANCE_NAME}_studio
    image: supabase/studio:latest
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: "Local Supabase (${INSTANCE_NAME})"
      DEFAULT_PROJECT_NAME: "${INSTANCE_NAME}"
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      LOGFLARE_API_KEY: ""
      LOGFLARE_URL: ""
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started

  kong:
    container_name: supabase_${INSTANCE_NAME}_kong
    image: kong:2.8.1
    restart: unless-stopped
    ports:
      - "${KONG_HTTP_PORT}:8000"
      - "${KONG_HTTPS_PORT}:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat <<EOF > /tmp/kong.yml
        _format_version: "2.1"
        _transform: true

        consumers:
          - username: anon
            keyauth_credentials:
              - key: "$$ANON_KEY"
          - username: service_role
            keyauth_credentials:
              - key: "$$SERVICE_ROLE_KEY"

        services:
          - name: auth
            url: http://auth:9999
            routes:
              - name: auth-v1
                strip_path: true
                paths:
                  - /auth/v1
            plugins:
              - name: cors
                config:
                  origins:
                    - "*"
                  methods:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                    - OPTIONS
                  headers:
                    - Authorization
                    - Content-Type
                    - apikey
                    - X-Client-Info
                  exposed_headers:
                    - Content-Range
                    - X-Total-Count
                  max_age: 3600

          - name: rest
            url: http://rest:3000
            routes:
              - name: rest-v1
                strip_path: true
                paths:
                  - /rest/v1
            plugins:
              - name: cors
                config:
                  origins:
                    - "*"
                  methods:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                    - OPTIONS
                  headers:
                    - Authorization
                    - Content-Type
                    - apikey
                    - X-Client-Info
                    - Prefer
                  exposed_headers:
                    - Content-Range
                    - X-Total-Count
                  max_age: 3600
              - name: key-auth
                config:
                  key_names:
                    - apikey
                  hide_credentials: false

          - name: storage
            url: http://storage:5000
            routes:
              - name: storage-v1
                strip_path: true
                paths:
                  - /storage/v1
            plugins:
              - name: cors
                config:
                  origins:
                    - "*"
                  methods:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                    - OPTIONS
                  headers:
                    - Authorization
                    - Content-Type
                    - apikey
                    - X-Client-Info
                  max_age: 3600

          - name: realtime
            url: http://realtime:4000/socket
            routes:
              - name: realtime-v1
                strip_path: true
                paths:
                  - /realtime/v1
            plugins:
              - name: cors
                config:
                  origins:
                    - "*"
                  methods:
                    - GET
                    - POST
                    - OPTIONS
                  headers:
                    - Authorization
                    - Content-Type
                    - apikey
                    - X-Client-Info
                  max_age: 3600
        EOF
        exec /docker-entrypoint.sh kong docker-start
    depends_on:
      db:
        condition: service_healthy

  db-setup:
    container_name: supabase_${INSTANCE_NAME}_db_setup
    image: supabase/postgres:${POSTGRES_VERSION:-15.6.1.143}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for PostgreSQL to accept connections..."
        ADMIN_PASS=""
        for i in $$(seq 1 30); do
          if PGPASSWORD="$$POSTGRES_PASSWORD" psql -h db -U supabase_admin -d postgres -c "SELECT 1;" >/dev/null 2>&1; then
            ADMIN_PASS="$$POSTGRES_PASSWORD"
            break
          elif PGPASSWORD="postgres" psql -h db -U supabase_admin -d postgres -c "SELECT 1;" >/dev/null 2>&1; then
            ADMIN_PASS="postgres"
            break
          fi
          sleep 1
        done

        if [ -n "$$ADMIN_PASS" ]; then
          PGPASSWORD="$$ADMIN_PASS" psql -h db -U supabase_admin -d postgres -c "
            ALTER USER supabase_admin WITH PASSWORD '$$POSTGRES_PASSWORD';
            ALTER USER postgres WITH PASSWORD '$$POSTGRES_PASSWORD';
            ALTER USER anon WITH PASSWORD '$$POSTGRES_PASSWORD';
            ALTER USER authenticated WITH PASSWORD '$$POSTGRES_PASSWORD';
            ALTER USER authenticator WITH PASSWORD '$$POSTGRES_PASSWORD';
            ALTER USER supabase_auth_admin WITH PASSWORD '$$POSTGRES_PASSWORD';
            ALTER USER supabase_storage_admin WITH PASSWORD '$$POSTGRES_PASSWORD';
            CREATE SCHEMA IF NOT EXISTS _realtime;
            ALTER SCHEMA _realtime OWNER TO supabase_admin;
          "
        fi

  auth:
    container_name: supabase_${INSTANCE_NAME}_auth
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    ports:
      - "${AUTH_PORT}:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable&search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: "${GOTRUE_URI_ALLOW_LIST:-*}"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  rest:
    container_name: supabase_${INSTANCE_NAME}_rest
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    ports:
      - "${REST_PORT}:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public,extensions}
      PGRST_MAX_ROWS: ${PGRST_MAX_ROWS:-1000}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_BUILTIN_AUTH: "false"
      PGRST_ADMIN_SERVER_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  realtime:
    container_name: supabase_${INSTANCE_NAME}_realtime
    image: supabase/realtime:v2.30.23
    restart: unless-stopped
    ports:
      - "${REALTIME_PORT}:4000"
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime,realtime,public'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "65536"
      APP_NAME: realtime
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  storage:
    container_name: supabase_${INSTANCE_NAME}_storage
    image: supabase/storage-api:v1.11.13
    restart: unless-stopped
    ports:
      - "${STORAGE_PORT}:5000"
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      FILE_STORAGE_BACKEND_PATH: ${FILE_STORAGE_BACKEND_PATH}
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: ""
    volumes:
      - storage_data:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      rest:
        condition: service_started

  meta:
    container_name: supabase_${INSTANCE_NAME}_meta
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    ports:
      - "${META_PORT}:8080"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  db:
    container_name: supabase_${INSTANCE_NAME}_db
    image: supabase/postgres:${POSTGRES_VERSION:-15.6.1.143}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  tunnel:
    container_name: supabase_${INSTANCE_NAME}_tunnel
    image: node:20-alpine
    restart: unless-stopped
    environment:
      TUNNEL_SERVER: ${TUNNEL_SERVER:-wss://jcode.api.br}
      TUNNEL_AUTH_TOKEN: ${TUNNEL_AUTH_TOKEN:-user_token_abc}
      API_TUNNEL_ID: ${INSTANCE_NAME}
      API_TARGET_HOST: kong
      API_TARGET_PORT: 8000
      STUDIO_TUNNEL_ID: ${INSTANCE_NAME}-studio
      STUDIO_TARGET_HOST: studio
      STUDIO_TARGET_PORT: 3000
    volumes:
      - ./tunnel:/app/tunnel
    working_dir: /app/tunnel
    command: ["sh", "-c", "if [ ! -d node_modules/ws ]; then npm install --production; fi && node runner.js"]
    depends_on:
      - kong
      - studio

